[package]
name = "pyo3-mesonpy"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pyo3_mesonpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { git = "https://github.com/PyO3/pyo3", rev = "refs/pull/6483/head", features = ["extension-module"] }
pyo3-ffi = { git = "https://github.com/PyO3/pyo3", rev = "refs/pull/6483/head" }
